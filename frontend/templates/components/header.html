<!-- Top Header Component -->
<header class="top-header">
    <div class="header-left">
        <button class="mobile-nav-toggle" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div>
            <h1 class="page-title">{% block header_title %}Dashboard{% endblock %}</h1>
            <p class="page-description">{% block header_description %}Track your study goals, focus sessions, and deadlines.{% endblock %}</p>
        </div>
    </div>

    <div class="header-actions">
        <!-- Daily Streak Badge -->
        {% if stats and stats.study_streak > 0 %}
        <div class="badge" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); padding: 6px 12px;">
            🔥 {{ stats.study_streak }} Day Streak
        </div>
        {% endif %}

        <!-- Quick Start Focus -->
        <a href="{{ url_for('views.timer') }}" class="btn btn-outline btn-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Focus Mode</span>
        </a>

        <!-- Ask AI Button -->
        <button type="button" class="btn btn-ai-sparkle btn-sm" onclick="openModal('aiModal')" title="Ask AI Study Assistant">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>✨ Ask AI</span>
        </button>

        <!-- Add Task Action -->
        <button class="btn btn-primary btn-sm" onclick="openModal('taskModal')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Task</span>
        </button>

        <!-- Sign Out Button -->
        <a href="{{ url_for('views.logout') }}" class="btn btn-outline btn-sm" title="Sign Out" style="color: #f87171; border-color: rgba(239, 68, 68, 0.35);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sign Out</span>
        </a>
    </div>
</header>
